# SWE-GNN backbone on the synthetic 2D family at the LEGACY official-class
# depth (2 outer layers x K=8 internal hops = 16 message-passing hops/step).
#
# This is the arm behind runs/MS4_2d_swegnn_s* (E4/E5 main table): the 2D
# runners historically trained it from the 1D official config (whose class
# default is n_GNN_layers=2). The official repository's saved best models are
# 1 x 8 (see configs/2d_swegnn_official.yaml and the E1-E5 evidence chain in
# plan/paper1x8_swegnn_runbook.md) — that depth-faithful arm is MS4b_2d_*.
# Both generations are kept: 2x8 for continuity with the E4/E5 protocol,
# 1x8 (2d_swegnn_official.yaml) as the paper baseline.
model:
  arch: flow_mdk
  hidden_dim: 64               # official hid_features: 64
  num_message_passing_layers: 2  # official outer layers (class default n_GNN_layers=2)
  hops_per_layer: 8            # official "K: 8  # num GNN layers"
  hidden_activation: tanh      # official gnn_activation: 'tanh' (applied per layer)
  num_previous_steps: 1        # official previous_t: 2 frames (current + 1)
  num_dynamic_vars: 2
  # Harness parity with the E4/E5/MS4b runs — see 2d_flow_mdk.yaml for why
  # this stays 0 on the 2D layout (uniform cell area => constant WSE offset,
  # shared by every arm).
  elevation_feature_idx: 0
  mdk:
    use: false                 # pure SWE-GNN: no diffusion branch

train:
  horizon_max: 8               # official rollout_steps: 8
  curriculum_steps: 15         # official curriculum_epoch: 15
  var_weights: [1.0, 3.0]      # official velocity_scaler: 3
  only_where_water: true       # official only_where_water: true
  lr: 0.007                    # official learning_rate (paper text says 0.005)
  lr_decay: 0.9                # official gamma
  lr_step_epochs: 7            # official step_size
  max_epochs: 150
  early_stop_patience: 30      # official patience: 30
  batch_size: 8
  grad_clip_value: 0.5         # official clip_grad_value_(0.5)

data:
  name: 2d_grid
  root: data/scenarios_2d_family

seed: 0
device: auto
out_dir: runs/2d_swegnn_2x8
