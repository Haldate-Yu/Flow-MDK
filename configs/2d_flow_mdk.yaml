# Flow-MDK full model on the synthetic 2D family: SWE-GNN backbone + directed
# MDK diffusion branch (E4/E5 protocol: G=64, 6L x 1-hop, 150 epochs,
# curriculum 15, batch 8, patience 99 via the runner).
model:
  hidden_dim: 64
  num_message_passing_layers: 6
  hops_per_layer: 1              # official SWE-GNN uses 8 (see 2d_swegnn_official.yaml)
  num_previous_steps: 1
  num_dynamic_vars: 2
  # Harness parity with the E4/E5/MS4b runs (which inherited 0 from the 1D
  # base configs): the model-side WSE (static[:, idx] + h) feeds the MDK
  # direction gates and the water-level channel refresh. The 2D layout keeps
  # bed elevation at column 1 and cell area at column 0, so idx=0 makes the
  # WSE proxy `area + h` — on the synthetic family area is uniform
  # (cell_size^2), i.e. a per-run constant offset of the true WSE, identical
  # for every arm. Changing to 1 would be cleaner but breaks comparability
  # with every trained checkpoint (see baselines/unet.py harness-parity note).
  elevation_feature_idx: 0
  mdk:
    use: true
    num_steps: 2                # K: matched to sqrt(2 D dt)/dx (see layers.mdk.suggest_num_steps)
    weighting: geometric        # S2GC MDK series
    lambda0: 0.3                # identity/teleport coefficient (over-smoothing cap)
    learn_lambda: true
    directed: true              # flow-directed transition matrix
    wet_gate: source            # dry nodes never relay diffusion
    mixing: learned             # per-channel advection/diffusion gate
    edge_weight: discharge      # |q|-weighted conductance
    direction_beta: 1.0

train:
  horizon_max: 8
  curriculum_steps: 15
  var_weights: [1.0, 3.0]
  lr: 0.007                    # official learning_rate
  lr_decay: 0.9
  lr_step_epochs: 7
  max_epochs: 150
  early_stop_patience: 30
  batch_size: 8
  grad_clip_value: 0.5         # official clip_grad_value_(0.5)

data:
  name: 2d_grid
  root: data/scenarios_2d_family

seed: 0
device: auto
out_dir: runs/2d_flow_mdk
