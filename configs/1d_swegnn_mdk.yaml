# E1 final attempt (MS5 arm): shallow multi-hop skeleton + MDK mixing.
# Official SWE-GNN skeleton — identical to 1d_swegnn_official.yaml (2 outer
# layers x 8 internal hops, per-hop weight matrices, tanh) — with the
# directed MDK diffusion branch switched on (mdk params identical to
# 1d_flow_mdk.yaml). Only diff vs the official skeleton: the mdk block, so
# any delta vs swegnn is attributable to the diffusion branch alone.
#
# Motivation (E1/E2/E3, 2026-09): depth is the drift carrier (E2: 3L+MDK
# probe 0.778; lr/early-stop probes worse) and the 2Lx8 skeleton is the best
# 1D in-domain model — this arm tests whether MDK mixing on the drift-
# resistant skeleton reaches the gcn/gat best.pt band (0.777±0.032 /
# 0.866±0.102, MS4 3-seed reference) without the 6-layer drift penalty.
model:
  arch: flow_mdk
  hidden_dim: 64               # official hid_features: 64
  num_message_passing_layers: 2  # official outer layers (n_GNN_layers=2)
  hops_per_layer: 8            # official "K: 8  # num GNN layers"
  hidden_activation: tanh      # official gnn_activation: 'tanh'
  num_previous_steps: 1
  num_dynamic_vars: 2
  elevation_feature_idx: 0     # 1D layout: z_bottom channel
  mdk:
    use: true                  # the experiment: diffusion branch on the shallow skeleton
    num_steps: 2               # K: matched to sqrt(2 D dt)/dx (layers.mdk.suggest_num_steps)
    weighting: geometric       # S2GC MDK series
    lambda0: 0.3               # identity/teleport coefficient (over-smoothing cap)
    learn_lambda: true
    directed: true             # flow-directed transition matrix
    wet_gate: source           # dry nodes never relay diffusion
    mixing: learned            # per-channel advection/diffusion gate
    edge_weight: discharge     # |Q|-weighted conductance
    direction_beta: 1.0

train:
  horizon_max: 8               # official rollout_steps: 8
  curriculum_steps: 15         # official curriculum_epoch: 15
  var_weights: [1.0, 3.0]      # official velocity_scaler: 3
  only_where_water: true       # official only_where_water: true
  lr: 0.007                    # official learning_rate
  lr_decay: 0.9                # official gamma
  lr_step_epochs: 7            # official step_size
  max_epochs: 150
  early_stop_patience: 30
  batch_size: 8
  grad_clip_value: 0.5         # official clip_grad_value_(0.5)

data:
  name: 1d_chain
  root: data/scenarios_1d

seed: 0
device: auto
out_dir: runs/1d_swegnn_mdk
