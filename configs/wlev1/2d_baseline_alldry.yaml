# All-dry floor (A4 补齐): predicted depth is identically zero — the second
# no-skill reference of the forecast-verification protocol (besides
# persistence). Zero parameters, zero training; evaluated with
# `evaluate.py --checkpoint none`.
#
# Why this file exists (Card 1): the paper protocol declares two trivial
# references (persistence + all-dry) but only the persistence floor was ever
# computed (runs/results.csv has floor_persist_* rows only). On sparse fields
# the all-dry RMSE = sqrt(E[h^2]) can sit BELOW persistence (dry cells dominate
# the mean), so it — not persistence — may be the binding floor; it must be
# reported before any "RMSE beats the reference" claim is read.
#
# Evaluated per data root via the twin-config trick (out_dir overridden):
#   runs/W1_floor_alldry_2d_family / _2d_larger / _exams_2d_h8 / _exams_2d
model:
  arch: baseline_alldry
  hidden_dim: 64
  num_message_passing_layers: 6
  hops_per_layer: 1              # official SWE-GNN uses 8 (see 2d_swegnn_official.yaml)
  num_previous_steps: 1
  num_dynamic_vars: 2
  # Irrelevant for the all-dry reference (no WSE is reconstructed), kept at
  # the corrected harness value for uniformity — see 2d_flow_mdk_wlev1.yaml.
  elevation_feature_idx: 1
  mdk:
    use: false               # unused by baselines
    num_steps: 2                # K: matched to sqrt(2 D dt)/dx (see layers.mdk.suggest_num_steps)
    weighting: geometric        # S2GC MDK series
    lambda0: 0.3                # identity/teleport coefficient (over-smoothing cap)
    learn_lambda: true
    directed: true              # flow-directed transition matrix
    wet_gate: source            # dry nodes never relay diffusion
    mixing: learned             # per-channel advection/diffusion gate
    edge_weight: discharge      # |q|-weighted conductance
    direction_beta: 1.0

train:
  horizon_max: 8
  curriculum_steps: 15
  var_weights: [1.0, 3.0]
  lr: 0.007                    # official learning_rate
  lr_decay: 0.9
  lr_step_epochs: 7
  max_epochs: 150
  early_stop_patience: 30
  batch_size: 8
  grad_clip_value: 0.5         # official clip_grad_value_(0.5)

data:
  name: 2d_grid
  root: data/scenarios_2d_family

seed: 0
device: auto
out_dir: runs/W1_floor_alldry_2d_family
