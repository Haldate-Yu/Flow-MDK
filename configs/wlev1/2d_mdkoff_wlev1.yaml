# Flow-MDK harness with the diffusion branch OFF — **W1 water-level fix** variant
# (the depth-matched -MDK ablation, mirroring L16_mdkoff_2d_s*).
#
# Card 1 (plan/card1_wlev1_channel_fix.md): byte-for-byte copy of
# configs/2d_swegnn_baseline.yaml (the arm run_L16_ablation.sh launches) with
# `elevation_feature_idx: 1`. The mechanism trio at matched depth AND with the
# corrected water-level channel:
#   directed (W1_2d_flow_mdk) / no branch (W1_2d_mdkoff) / symmetric (W1_2d_ssgc)
#
# Artifacts: runs/W1_2d_mdkoff_s<seed> (out_dir overridden per seed).

model:
  hidden_dim: 64
  num_message_passing_layers: 6
  hops_per_layer: 1              # official SWE-GNN uses 8 (see 2d_swegnn_official.yaml)
  num_previous_steps: 1
  num_dynamic_vars: 2
  elevation_feature_idx: 1       # W1 fix: bed + h (see 2d_flow_mdk_wlev1.yaml)
  mdk:
    use: false                   # ablation -MDK: no diffusion branch
    num_steps: 2                # K: matched to sqrt(2 D dt)/dx (see layers.mdk.suggest_num_steps)
    weighting: geometric        # S2GC MDK series
    lambda0: 0.3                # identity/teleport coefficient (over-smoothing cap)
    learn_lambda: true
    directed: true              # flow-directed transition matrix
    wet_gate: source            # dry nodes never relay diffusion
    mixing: learned             # per-channel advection/diffusion gate
    edge_weight: discharge      # |q|-weighted conductance
    direction_beta: 1.0

train:
  horizon_max: 8
  curriculum_steps: 15
  var_weights: [1.0, 3.0]
  lr: 0.007                    # official learning_rate
  lr_decay: 0.9
  lr_step_epochs: 7
  max_epochs: 150
  early_stop_patience: 30      # runner passes 99 (sibling-arm protocol)
  batch_size: 8
  grad_clip_value: 0.5         # official clip_grad_value_(0.5)

data:
  name: 2d_grid
  root: data/scenarios_2d_family

seed: 0
device: auto
out_dir: runs/W1_2d_mdkoff
