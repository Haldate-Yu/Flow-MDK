# Flow-MDK full model on the synthetic 2D family — **W1 water-level fix** variant.
#
# Why this file exists
# -------------------
# Card 1 (plan/card1_wlev1_channel_fix.md): every arm that produced the paper
# numbers ran with `elevation_feature_idx: 0`, i.e. the water-level channel was
# `area + h`. On the synthetic family (uniform 100 m cells) the area term is a
# per-run constant, so gates there effectively saw the *depth* gradient; on the
# real meshes (areas 2-879 m2, CV 1.29) it drowned the true water-surface
# slope and the direction gate agreed with reality at ~49% (paper 2.2/4.4).
#
# This variant sets `elevation_feature_idx: 1` so BOTH sides of the harness
# use the physical water level `w = bed elevation + h`:
#   * dataset side: scripts/train.py / evaluate.py already hardcode elev_idx=1
#     when appending the channel (2d-only branch);
#   * model side: AutoregressiveSurrogate._refresh_static and the MDK gate
#     follow `model.elevation_feature_idx` — this file flips it to 1.
# Everything else is byte-identical to configs/2d_flow_mdk.yaml (the MS4_2d
# protocol: G=64, 6L x 1-hop, 150 epochs, curriculum 15, batch 8; the runner
# passes early_stop_patience=99). The old configs stay untouched so every
# legacy checkpoint stays reproducible.
#
# Artifacts: runs/W1_2d_flow_mdk_s<seed> (out_dir overridden per seed).

model:
  hidden_dim: 64
  num_message_passing_layers: 6
  hops_per_layer: 1              # official SWE-GNN uses 8 (see 2d_swegnn_official.yaml)
  num_previous_steps: 1
  num_dynamic_vars: 2
  # W1 fix: physical water level `w = bed elevation + h` on BOTH the dataset
  # side (hardcoded elev_idx=1 in train.py/evaluate.py) and the model side
  # (this field drives _refresh_static and the MDK direction gate).
  elevation_feature_idx: 1
  mdk:
    use: true
    num_steps: 2                # K: matched to sqrt(2 D dt)/dx (see layers.mdk.suggest_num_steps)
    weighting: geometric        # S2GC MDK series
    lambda0: 0.3                # identity/teleport coefficient (over-smoothing cap)
    learn_lambda: true
    directed: true              # flow-directed transition matrix
    wet_gate: source            # dry nodes never relay diffusion
    mixing: learned             # per-channel advection/diffusion gate
    edge_weight: discharge      # |q|-weighted conductance
    direction_beta: 1.0

train:
  horizon_max: 8
  curriculum_steps: 15
  var_weights: [1.0, 3.0]
  lr: 0.007                    # official learning_rate
  lr_decay: 0.9
  lr_step_epochs: 7
  max_epochs: 150
  early_stop_patience: 30      # runner passes 99 (sibling-arm protocol)
  batch_size: 8
  grad_clip_value: 0.5         # official clip_grad_value_(0.5)

data:
  name: 2d_grid
  root: data/scenarios_2d_family

seed: 0
device: auto
out_dir: runs/W1_2d_flow_mdk
